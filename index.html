# mafia42-daily-counter
<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>마피아42 획초 카운터</title>

    <!-- CSS -->

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/gallery.css">
    <link rel="stylesheet" href="css/deck.css">
    <link rel="stylesheet" href="css/timer.css">

</head>

<body>

<div class="container">

    <!-- ========================= -->
    <!-- Sidebar                  -->
    <!-- ========================= -->

    <aside class="sidebar">

        <div class="logo">

            <h2>마피아42</h2>

            <span>획초 카운터</span>

        </div>

        <nav>

            <button
                id="deckBtn"
                class="menu-btn active">

                덱 설정

            </button>

            <button
                id="newGameBtn"
                class="menu-btn">

                새 게임

            </button>

        </nav>
        
        <div class="sidebar-footer">

            Version 1.0
        
        </div>

    </aside>


    <!-- ========================= -->
    <!-- Main                      -->
    <!-- ========================= -->

    <main class="content">

    <div class="content-header">

        <h2>TIME</h2>

        <div id="turnCount">

            0 / 31

        </div>

    </div>

    <ul
        id="timeList"
        class="time-list">

    </ul>

    </main>


        <!-- ========================= -->
        <!-- Gallery                   -->
        <!-- ========================= -->

        <section class="gallery">

            <div class="gallery-header">

                <h2>DECK</h2>

                <span id="deckCount">

                    0 / 12

                </span>

            </div>

            <div
                id="imageGrid"
                class="image-grid">

            </div>

        </section>

    </div>


<!-- ========================= -->
<!-- Context Menu              -->
<!-- ========================= -->

<div
    id="contextMenu"
    class="context-menu">

    <button
        id="editRecord">

        ✏ 수정

    </button>

    <button
        id="deleteRecord">

        🗑 마지막 기록 삭제

    </button>

</div>


<!-- ========================= -->
<!-- JavaScript                -->
<!-- ========================= -->

<script src="js/character.js"></script>

<script src="js/deck.js"></script>

<script src="js/gallery.js"></script>

<script src="js/timer.js"></script>

<script src="js/app.js"></script>
<!-- ==========================================
                Deck Modal
========================================== -->

<div
    id="deckModal"
    class="modal hidden">

    <div
        id="deckPage">

    </div>

</div>

</body>

</html>
